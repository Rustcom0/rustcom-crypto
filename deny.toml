[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "AGPL-3.0-only",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { name = "openssl-sys", reason = "Pure-Rust WASM-compatible crypto only." },
  { name = "openssl", reason = "Pure-Rust WASM-compatible crypto only." },
  { name = "md-5", reason = "Weak hash banned." },
  { name = "sha-1", reason = "Weak hash banned." },
  { name = "rust-crypto", reason = "Unmaintained crate banned." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
