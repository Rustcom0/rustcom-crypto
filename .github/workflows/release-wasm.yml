name: Deterministic WASM Release & Rekor v2 Attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build-deterministic-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      builder_digest: ${{ steps.builder.outputs.digest }}
      release_version: ${{ steps.meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain for vendoring and self-check
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Compute release metadata
        id: meta
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            RELEASE_VERSION="0.1.0-dev"
          fi
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build digest-pinned deterministic WASM builder image
        id: builder
        run: |
          docker build -f builder/Dockerfile.wasm -t rustcom-wasm-builder:release .
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY,,}/wasm-builder:${{ steps.meta.outputs.release_version }}"
            docker tag rustcom-wasm-builder:release "${IMAGE_REF}"
            docker push "${IMAGE_REF}"
            BUILDER_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | cut -d'@' -f2)"
          else
            BUILDER_DIGEST="$(docker image inspect --format='{{.Id}}' rustcom-wasm-builder:release)"
          fi
          echo "digest=${BUILDER_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Vendor crates for offline --network=none build parity
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml

      - name: Run dual-path (/build-a vs /build-b) offline deterministic WASM build
        run: |
          mkdir -p dist
          chmod 0777 dist
          docker run --rm --network=none \
            -e SOURCE_DATE_EPOCH="${{ steps.meta.outputs.source_date_epoch }}" \
            -e RELEASE_VERSION="${{ steps.meta.outputs.release_version }}" \
            -e GIT_COMMIT="${{ steps.meta.outputs.git_commit }}" \
            -e BUILDER_IMAGE_DIGEST="${{ steps.builder.outputs.digest }}" \
            --mount "type=bind,source=${PWD},target=/src,readonly" \
            --mount "type=bind,source=${PWD}/dist,target=/out" \
            rustcom-wasm-builder:release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-wasm-dist
          path: dist/
          retention-days: 7

  sign-and-release:
    needs: build-deterministic-wasm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: deterministic-wasm-dist
          path: dist

      - name: Install Rust toolchain for rustcom-verify self-check
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: "1.97.1"

      - name: Install pinned Sigstore Cosign v3 (Rekor v2 + RFC 3161 TSA v0.3 bundle)
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: "v3.1.4"

      - name: Sign release-manifest.json via Sigstore Cosign OIDC -> Rekor v2 + TSA
        run: |
          cosign sign-blob --yes \
            --new-bundle-format \
            --use-signing-config \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.json

      - name: Self-verify release-manifest.json & Rekor v2 + TSA bundle with rustcom-verify
        run: |
          cargo build --locked --release -p rustcom-verify
          ./target/release/rustcom-verify manifest \
            --manifest dist/release-manifest.json \
            --bundle dist/release-manifest.sigstore.json

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/rustcom_crypto_wasm.js \
            dist/rustcom_crypto_wasm_bg.wasm \
            dist/release-manifest.json \
            dist/release-manifest.sigstore.json \
            --title "rustcom-crypto ${GITHUB_REF_NAME}" \
            --generate-notes
