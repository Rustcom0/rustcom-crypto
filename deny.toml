[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "AGPL-3.0",
  "Unicode-3.0",
]

[bans]
wildcards = "deny"
deny = [
  { name = "openssl-sys", reason = "Pure-Rust WASM-compatible crypto only." },
  { name = "openssl", reason = "Pure-Rust WASM-compatible crypto only." },
  { name = "md-5", reason = "Weak hash banned." },
  { name = "sha-1", reason = "Weak hash banned." },
  { name = "rust-crypto", reason = "Unmaintained crate banned." },
]
